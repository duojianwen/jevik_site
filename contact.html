  <div class="bubble" style="width:110px;height:110px;left:0%;top:0%"></div>

  <p class="lede" data-i18n="contact.lede">有项目想法或想合作？给我留言，我会在 24 小时内回复。</p>
</header>

<main class="wrap contact-grid">
  <section class="info-card rv">
    <h2 data-i18n="contact.info">联系信息</h2>
    <div class="info-row"><div class="info-ic">✉️</div><div><div class="k" data-i18n="contact.email">邮箱</div><div class="v">duojianwen@gmail.com</div></div></div>
    <h2 style="font-size:24px;margin:26px 0 18px" data-i18n="contact.socials">社交链接</h2>
    <div class="social-grid" aria-label="Social links">
      <a class="social-card" href="#" data-social-placeholder="github"><span class="social-mark">GH</span><span><b>GitHub</b><small>待填写主页链接</small></span></a>
      <a class="social-card" href="#" data-social-placeholder="x"><span class="social-mark">𝕏</span><span><b>X</b><small>待填写主页链接</small></span></a>
      <button class="social-card qr-card" type="button" disabled><span class="qr-placeholder">WE</span><span><b>微信</b><small>待替换二维码图片</small></span></button>
      <button class="social-card qr-card" type="button" disabled><span class="qr-placeholder">QQ</span><span><b>QQ</b><small>待替换二维码图片</small></span></button>
    </div>
    <div class="avail">
      <div class="k"><span class="dot"></span><span data-i18n="contact.availK">可接单状态</span></div>
      <div class="v" data-i18n="contact.availV">接受自由职业</div>
      <div class="s" data-i18n="contact.availS">欢迎新项目 · 通常 24 小时内回复</div>
    </div>
  </section>

  <section class="form-card rv">
    <h2 data-i18n="contact.form">发送消息</h2>
    <form id="contactForm" novalidate>
      <div class="f-field"><label for="cf-name" data-i18n="contact.name">你的名字</label>
        <input id="cf-name" name="name" placeholder="例如：Alex Morgan" data-i18n-ph="contact.namePh">
        <div class="f-err" data-err="name"></div></div>
      <div class="f-field"><label for="cf-email" data-i18n="contact.emailAddr">邮箱地址</label>
        <input id="cf-email" name="email" type="email" placeholder="alex@example.com">
        <div class="f-err" data-err="email"></div></div>
      <div class="f-field"><label for="cf-msg" data-i18n="contact.msg">你的留言</label>
        <textarea id="cf-msg" name="message" placeholder="介绍你的项目、目标、时间线或任何问题……" data-i18n-ph="contact.msgPh"></textarea>
        <div class="f-err" data-err="message"></div></div>
      <button type="submit" class="btn btn-grad btn-send"><span data-i18n="contact.send">发送消息</span> →</button>
      <p class="form-note"><span data-i18n="contact.note">我通常在 24 小时内回复。绝无垃圾邮件。</span>
        <span class="lock">🔒 <span data-i18n="contact.privacy">你的信息受到保护，严格保密</span></span></p>
    </form>
  </section>
